version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'npm'
    directory: '/nuxt'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Storybook add-on, pinned to match @nuxtjs/storybook - same
      # exclusion already carried in renovate.json.
      - dependency-name: '@nuxtjs/storybook'

  - package-ecosystem: 'composer'
    directory: '/drupal'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
