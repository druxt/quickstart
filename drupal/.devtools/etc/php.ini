; Used via PHPRC by .devtools/helpers.php's drush() wrapper. Drupal installs
; can exceed PHP's default 128M memory_limit, and `-d` overrides on the
; parent process don't reach the child PHP process Drush's SiteProcess
; spawns for `site-install` - PHPRC does, since it's inherited as an
; environment variable rather than passed as a CLI flag.
memory_limit = -1
